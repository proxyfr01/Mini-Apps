<!DOCTYPE html>
<html>
<head>
  <title>Stylish Sticky Notes</title>
</head>
<body style="font-family: Arial; background:#f4f6f9; margin:0; padding:0;">

  <div style="text-align:center; padding:30px;">
    <h1 style="margin-bottom:20px;">📝 Sticky Notes</h1>

    <input 
      type="text" 
      id="noteInput" 
      placeholder="Write something..."
      style="padding:10px; width:250px; border-radius:8px; border:1px solid #ccc;"
    >

    <button 
      onclick="addNote()"
      style="padding:10px 15px; border:none; border-radius:8px; background:#4CAF50; color:white; cursor:pointer;"
    >
      Add Note
    </button>

    <div id="notesContainer" 
         style="margin-top:30px; display:flex; flex-wrap:wrap; justify-content:center; gap:15px;">
    </div>
  </div>

<script src="stickynotes.js"></script>
</body>
</html>
